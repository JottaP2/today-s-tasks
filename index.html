<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Assets/css/style.css">
    <title>Document</title>
</head>

<body>
    <main class="mainContainer">
        <section class="content">
            <h1>Today</h1>
            <article class="mainTasks">
                <ul class="boxTasks" id="lista">
                    <li class="elementoTask" id="taskStyle"><input type="checkbox" id="check"> Tarefa 1
                        <button class="btnApagar" onclick="btnApagar(this)"><img src="./Assets/excluir.svg" alt="icon de apagar"></button>
                    </li>
                </ul>
            </article>
        </section>
        <div class="task-input">
            
            <input type="text" placeholder="Nova tarefa..." id="newTask" onkeydown="if(event.key === 'Enter'){ event.preventDefault(); novaTask(); }">
            <button type="button" id="addTaskBtn" onclick="novaTask()">Add</button>
        </div>
    </main>
</body>

<script src="/Assets/js/main.js"></script>

</html>
